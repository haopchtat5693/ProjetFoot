<main class="login-shell">
	<section class="login-card">
		<p class="eyebrow">Account access</p>
		<h1>{{ pageTitle }}</h1>
		<p class="intro">{{ introText }}</p>

		<form class="login-form" (ngSubmit)="submit()">
			<label>
				<span>Username</span>
				<input name="username" [(ngModel)]="form.username" placeholder="johndoe" required />
			</label>

			@if (isRegisterMode) {
				<label>
					<span>Role</span>
					<select name="role" [(ngModel)]="form.role">
						@for (role of roles; track role.value) {
							<option [value]="role.value">{{ role.label }}</option>
						}
					</select>
				</label>
			}

			<label>
				<span>Password</span>
				<input
					name="password"
					[(ngModel)]="form.password"
					type="password"
					placeholder="••••••••"
					required
				/>
			</label>

			<div class="actions">
				<button type="submit" class="button">{{ submitLabel }}</button>
				<button type="button" class="button button-ghost" (click)="toggleMode()">
					{{ isRegisterMode ? 'I already have an account' : 'Create a new account' }}
				</button>
				<a class="button button-ghost" routerLink="/">Cancel</a>
			</div>
		</form>
	</section>
</main>
